; ============================================================
; MiniMax Usage Widget v5 - Dual Ring
; ============================================================
[Rainmeter]
Update=2000
; O4 fix: removed SkinWidth / SkinHeight / OnDesktopClickThrough / DefaultMouseAction;
; none of them are valid [Rainmeter] options. Canvas size is determined by MeterBackground.
AlwaysOnTop=1
Dragging=1
SnapEdges=1
WindowX=1680
WindowY=940
AlphaValue=255

[Metadata]
Name=MiniMax Dual Ring Widget
Version=5.3

[Variables]
@Include=#@#Variables.inc

; ============================================================
; Measures - WebParser reads text cache files
; ============================================================

[MeasurePlan]
Measure=WebParser
URL=file:///#ProjectDirUri#/.cache/plan.txt
UpdateRate=15
RegExp=.*

[MeasurePct1]
Measure=WebParser
URL=file:///#ProjectDirUri#/.cache/pct1.txt
UpdateRate=15
RegExp=.*

[MeasureBar1]
Measure=WebParser
URL=file:///#ProjectDirUri#/.cache/bar1.txt
UpdateRate=15
RegExp=.*
MaxValue=1

[MeasureReset1]
Measure=WebParser
URL=file:///#ProjectDirUri#/.cache/reset1.txt
UpdateRate=15
RegExp=.*

[MeasurePct2]
Measure=WebParser
URL=file:///#ProjectDirUri#/.cache/pct2.txt
UpdateRate=15
RegExp=.*

[MeasureBar2]
Measure=WebParser
URL=file:///#ProjectDirUri#/.cache/bar2.txt
UpdateRate=15
RegExp=.*
MaxValue=1

[MeasureReset2]
Measure=WebParser
URL=file:///#ProjectDirUri#/.cache/reset2.txt
UpdateRate=15
RegExp=.*

[MeasureUpdated]
Measure=WebParser
URL=file:///#ProjectDirUri#/.cache/updated.txt
UpdateRate=15
RegExp=.*

[MeasureStatusText]
; P0-2 修复:用 Lua 脚本读 status.txt + 算新鲜度,基于 last-success-epoch.txt 判定
; 当 status.txt 超过 StaleAfterSec 秒未更新时,即使是 "● 稳定" 也会被覆盖为 "● 已过期"
; Lua 中通过 SELF:GetOption('StaleAfterSec', '180') 读取
Measure=Script
ScriptFile=#@#Freshness.lua
MeasureOption=StaleAfterSec=180
UpdateDivider=5

[MeasureDetailText]
Measure=WebParser
URL=file:///#ProjectDirUri#/.cache/detail.txt
UpdateRate=15
RegExp=.*

; ============================================================
; Calc Measures - colour thresholds
; ============================================================

[CalcPct1Num]
Measure=Calc
Formula=MeasurePct1
DynamicVariables=1

[CalcPct2Num]
Measure=Calc
Formula=MeasurePct2
DynamicVariables=1

[CalcColor1]
Measure=Calc
Formula=CalcPct1Num
IfCondition=(CalcPct1Num <= 10)
IfTrueAction=[!SetOption MeterRing1 LineColor "239,68,68,255"][!SetOption MeterRing1Value FontColor "239,68,68,255"]
IfCondition2=(CalcPct1Num > 10) && (CalcPct1Num <= 20)
IfTrueAction2=[!SetOption MeterRing1 LineColor "245,158,11,255"][!SetOption MeterRing1Value FontColor "245,158,11,255"]
IfCondition3=(CalcPct1Num > 20)
IfTrueAction3=[!SetOption MeterRing1 LineColor "#NormalColor#"][!SetOption MeterRing1Value FontColor "255,255,255,255"]
DynamicVariables=1

[CalcColor2]
Measure=Calc
Formula=CalcPct2Num
IfCondition=(CalcPct2Num <= 10)
IfTrueAction=[!SetOption MeterRing2 LineColor "239,68,68,255"][!SetOption MeterRing2Value FontColor "239,68,68,255"]
IfCondition2=(CalcPct2Num > 10) && (CalcPct2Num <= 20)
IfTrueAction2=[!SetOption MeterRing2 LineColor "245,158,11,255"][!SetOption MeterRing2Value FontColor "245,158,11,255"]
IfCondition3=(CalcPct2Num > 20)
IfTrueAction3=[!SetOption MeterRing2 LineColor "#WeeklyColor#"][!SetOption MeterRing2Value FontColor "255,255,255,255"]
DynamicVariables=1

; ============================================================
; Meters
; ============================================================

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,280,165,10 | Fill Color 32,32,32,220 | StrokeWidth 0
X=0
Y=0
AntiAlias=1

[MeterTitle]
Meter=String
MeasureName=MeasurePlan
X=14
Y=10
W=180
H=20
FontColor=255,255,255,255
FontFace=Segoe UI
FontSize=12
FontWeight=700
AntiAlias=1

[MeterStatusBadge]
Meter=String
MeasureName=MeasureStatusText
X=266
Y=10
W=0
H=20
FontColor=79,195,247,255
FontFace=Segoe UI
FontSize=11
FontWeight=700
StringAlign=Right
AntiAlias=1

